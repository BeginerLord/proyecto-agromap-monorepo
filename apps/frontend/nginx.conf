# Caché de imágenes (/uploads): con Backblaze B2 cada descarga desde el bucket cuenta como
# transacción; nginx guarda la copia y la API solo va a B2 la primera vez.
proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=uploads:10m max_size=1g inactive=30d use_temp_path=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API y documentación: mismo origen que el front → las cookies httpOnly funcionan sin CORS
  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Evidencias fotográficas y mapas (WebP) servidos por el backend desde B2 o disco
  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_cache uploads;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache-Status $upstream_cache_status;
  }

  location /docs {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  # Recursos con hash: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta la resuelve Vue Router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
